<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Tarot | 새로운 운명의 기록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>
<div th:replace="~{fragments/common :: headerFragment}"></div>

<main class="container my-5">
    <div class="text-center mb-5">
        <h2 class="save-title">기록의 서 작성</h2>
        <p class="text-secondary">당신의 생각과 통찰을 영구히 기록합니다.</p>
    </div>

    <div class="save-card">
        <form action="/save" method="post" enctype="multipart/form-data">
            <div class="mb-4">
                <label for="boardTitle" class="form-label"><i class="fa-solid fa-feather-pointed"></i> 기록의 제목</label>
                <input type="text" name="boardTitle" id="boardTitle" class="form-control" placeholder="운명의 제목을 입력하세요" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label for="boardWriter" class="form-label"><i class="fa-solid fa-user-pen"></i> 기록자</label>
                    <input type="text" name="boardWriter" id="boardWriter" th:value="${loginName}" th:readonly="${loginName != null}" class="form-control" placeholder="성함 또는 닉네임" required>
                </div>
                <div class="col-md-6 mb-4" th:if="${loginName == null}">
                    <label for="boardPass" class="form-label"><i class="fa-solid fa-lock"></i> 봉인 암호</label>
                    <input type="password" name="boardPass" id="boardPass" class="form-control"
                           placeholder="수정/삭제 시 필요합니다" required>
                </div>
                <input type="hidden" name="boardPass" th:if="${loginName != null}" value="AUTH_USER_POST">
            </div>

            <div class="mb-4">
                <label for="boardContents" class="form-label"><i class="fa-solid fa-book-open-reader"></i> 상세 내용</label>
                <textarea name="boardContents" id="boardContents" class="form-control" rows="10" placeholder="이곳에 당신의 통찰을 상세히 기록하세요..." required></textarea>
            </div>

            <div class="mb-5">
                <label class="form-label"><i class="fa-solid fa-image"></i> 형상(이미지) 첨부</label>
                <div class="file-input-wrapper">
                    <input type="file" name="boardFile" class="form-control mb-2" id="boardFile"
                           accept="image/*" multiple onchange="validateFiles(this)">
                    <p class="small text-secondary mb-0" id="fileHelp">이미지 파일만 최대 2개까지 선택 가능합니다. (개당 150KB 제한)</p>
                </div>
            </div>

            <div class="d-flex gap-3">
                <button type="button" class="btn  btn-cancel" onclick="history.back()">중단하기</button>
                <button type="submit" class="btn  btn-submit">기록의 서 등록</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/common :: footerFragment}"></div>

<script>
    function validateFiles(input) {
        const files = input.files;
        const maxCount = 2;
        const maxSize = 200 * 1024; // 150KB를 바이트로 변환

        if (files.length > maxCount) {
            alert("이미지는 최대 2개까지만 첨부할 수 있습니다.");
            input.value = ""; return;
        }

        for (let i = 0; i < files.length; i++) {
            if (!files[i].type.startsWith('image/')) {
                alert("이미지 파일만 업로드 가능합니다.");
                input.value = ""; return;
            }
            if (files[i].size > maxSize) {
                alert(files[i].name + "의 용량이 150KB를 초과합니다.");
                input.value = ""; return;
            }
        }
    }
</script>
</body>
</html>
