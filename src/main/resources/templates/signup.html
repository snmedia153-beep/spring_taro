<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Mystic Tarot | 회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
    <style>
        .signup-card { background: var(--card-bg); border: 1px solid var(--gold-accent); border-radius: 15px; padding: 40px; width: 100%; max-width: 500px; margin: auto; box-shadow: 0 0 30px rgba(224, 177, 21, 0.2); }
        .signup-title { font-family: 'Playfair Display', serif; color: var(--gold-accent); text-align: center; margin-bottom: 30px; }

        .divider { border-top: 1px solid #333; margin: 25px 0; position: relative; }
        .divider span { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--card-bg); padding: 0 15px; color: #666; font-size: 0.8rem; }
    </style>
</head>
<body>
<div th:replace="~{fragments/common :: headerFragment}"></div>
<main class="container my-5">
    <div class="signup-card">
        <h2 class="signup-title"><i class="fa-solid fa-star-and-crescent"></i> Join Us</h2>
        <p class="text-center text-secondary mb-4 small">당신의 운명을 기록할 새로운 계정을 생성합니다.</p>

        <form action="/api/auth/signup" method="post">
            <div class="mb-3">
                <label class="form-label">성함</label>
                <input type="text" name="name" class="form-control" placeholder="성함을 입력하세요" required>
            </div>
            <div class="mb-3">
                <label class="form-label">이메일 주소</label>
                <input type="email" name="email" class="form-control" placeholder="example@gmail.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">비밀번호</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="8자 이상의 비밀번호" required>
            </div>
            <div class="mb-4">
                <label class="form-label">비밀번호 확인</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="다시 한번 입력하세요" required>
                <div id="pw-error" class="text-danger small mt-1" style="display:none;">비밀번호가 일치하지 않습니다.</div>
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="terms" required>
                <label class="form-check-label small" for="terms">개인정보 수집 및 운명 열람 약관에 동의합니다.</label>
            </div>

            <button type="submit" class="btn btn-gold">비밀의 서약 완료</button>
        </form>

        <div class="divider"><span>OR</span></div>

        <div class="text-center">
            <p class="small mb-0">이미 회원이신가요? <a href="/login" style="color: var(--gold-accent); text-decoration: none;">로그인하러 가기</a></p>
        </div>
    </div>
</main>
<div th:replace="~{fragments/common :: footerFragment}"></div>
<script>
    // 간단한 비밀번호 일치 확인 스크립트
    document.querySelector('form').onsubmit = function(e) {
        const pw = document.getElementById('password').value;
        const confirmPw = document.getElementById('confirmPassword').value;
        if (pw !== confirmPw) {
            e.preventDefault();
            document.getElementById('pw-error').style.display = 'block';
        }
    };
</script>
</body>
</html>
