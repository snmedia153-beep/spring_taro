<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav th:fragment="headerFragment" class="navbar navbar-expand-lg navbar-dark sticky-top">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        // 1. 기본값 설정 (로그인 안 했을 때)
        let isAuthenticated = false;
        let userEmail = "";
        let userName = "비회원";
        /*]]>*/
    </script>

    <script sec:authorize="isAuthenticated()" th:inline="javascript">
        /*<![CDATA[*/
        isAuthenticated = true;
        // principal이 String(anonymousUser)이 아님이 보장된 상태에서만 안전하게 추출
        userEmail = [[${#authentication.principal.member.email}]];
        userName = [[${#authentication.principal.member.name}]];
        /*]]>*/
    </script>
    <script th:inline="javascript">
        // 1. 알림 데이터를 담을 배열 (실제 SSE나 API로 받은 데이터를 여기 추가)
        let notifications = [];
        async function checkUnreadNotifications() {
            try {
                // 우리 백엔드 API 호출 (파라미터로 이메일을 넘길 필요 없음)
                const response = await fetch('/api/notifications/unread');

                if (response.status === 200) {
                    const data = await response.json();

                    if (data && data.length > 0) {
                        data.forEach(noti => {
                            showNotification(noti.message);
                            // 읽음 처리도 우리 서버 API 호출
                            confirmReadAtServer(noti.id);
                        });
                    }
                }
            } catch (error) {
                console.error("알림 조회 실패:", error);
            }
        }

        async function confirmReadAtServer(id) {
            await fetch(`/api/notifications/read/${id}`, { method: 'POST' });
        }

        // 로그인 상태일 때만 실행
        document.addEventListener('DOMContentLoaded', () => {
            if (isAuthenticated) {
                checkUnreadNotifications();
            }
        });
        // 2. 부트스트랩 팝오버 초기화 및 내용 설정
        document.addEventListener('DOMContentLoaded', function () {
            const notifBtn = document.getElementById('notif-btn');

            // 팝오버 인스턴스 생성
            const popover = new bootstrap.Popover(notifBtn, {
                content: function () {
                    if (notifications.length === 0) {
                        return '<div class="text-secondary p-2 small">아직 도착한 알림이 없습니다.</div>';
                    }

                    // 알림이 있다면 리스트 형식으로 생성
                    let listHtml = '<ul class="list-group list-group-flush" style="width: 200px;">';
                    notifications.forEach(msg => {
                        listHtml += `<li class="list-group-item bg-transparent text-light border-secondary small">
                                        <i class="fa-solid fa-star-and-crescent text-warning me-1"></i> ${msg}
                                     </li>`;
                    });
                    listHtml += '</ul>';
                    return listHtml;
                }
            });

            // 클릭 시 기존 알림 개수 초기화 (선택 사항)
            notifBtn.addEventListener('click', function() {
                // document.getElementById('notif-count').innerText = '0';
            });
        });
        // 로그인 상태일 때만 SSE 연결 시도
        if (isAuthenticated) {
            const eventSource = new EventSource('/api/notifications/subscribe');

            // 서버에서 'notification'라는 이름으로 보낸 이벤트를 수신
            eventSource.addEventListener("notification", (event) => {
                showNotification(event.data);
            });
            // 연결 오류 시 재연결 로직 (브라우저가 자동으로 해주지만 로그 확인용)
            eventSource.onerror = (error) => {
                console.error("SSE 연결 오류:", error);
                // 필요 시 eventSource.close();
            };
        }
        // 3. 알림 추가 함수 (기존에 만든 showNotification 함수를 확장)
        function showNotification(message) {
            // 배열에 메시지 추가 (최신 5개만 유지)
            notifications.unshift(message);
            if (notifications.length > 5) notifications.pop();

            // 배지 카운트 증가
            const countBadge = document.getElementById('notif-count');
            if (countBadge) {
                countBadge.innerText = notifications.length;
            }

            // 기존에 만든 Toast 알림 띄우기
            const toastMessage = document.getElementById('toast-message');
            if (toastMessage) {
                toastMessage.innerText = message;
                const toast = new bootstrap.Toast(document.getElementById('notification-toast'));
                toast.show();
            }
        }
    </script>
    <div class="container">
        <a class="navbar-brand fs-3" href="/">✨ Mystic Tarot</a>
        <div class="d-flex align-items-center">
            <div class="position-relative me-4">
                <i class="fa-solid fa-bell fs-4 text-light"
                   id="notif-btn"
                   style="cursor:pointer;"
                   data-bs-toggle="popover"
                   data-bs-placement="bottom"
                   data-bs-html="true"
                   title="최신 운명 알림"></i>
                <span id="notif-count" class="badge rounded-pill bg-danger notification-badge">0</span>
            </div>

            <th:block sec:authorize="isAnonymous()">
                <a href="/login" class="btn btn-outline-light btn-sm me-2">로그인</a>
                <a href="/signup" class="btn btn-gold btn-sm" style="background-color: #e0b115; color: black; font-weight: bold;">회원가입</a>
            </th:block>

            <th:block sec:authorize="isAuthenticated()">
                <a href="/mypage" class="btn btn-outline-gold btn-sm me-2" style="color: #e0b115; border-color: #e0b115;">내 정보</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">로그아웃</button>
                </form>
            </th:block>
        </div>
    </div>
</nav>

<footer th:fragment="footerFragment" class="mt-5 py-4 border-top border-secondary text-center" style="background-color: #05050a; color: #888;">
    <div class="container">
        <p class="small text-secondary mb-0">&copy; 2026 <strong>SN Media</strong>. All rights reserved.</p>
        <div class="mt-2">
            <a href="/terms" class="text-secondary small me-3 text-decoration-none">이용약관</a>
            <a href="/privacy" class="text-secondary small text-decoration-none">개인정보처리방침</a>
        </div>
    </div>
</footer>

</html>
