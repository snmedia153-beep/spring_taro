<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Tarot | 운명의 광장</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>
<div th:replace="~{fragments/common :: headerFragment}"></div>

<main class="container mt-5">
    <div class="text-center mb-5">
        <h2 style="font-family: 'Playfair Display', serif; color: var(--gold-accent);" class="display-6">운명의 광장 (Community)</h2>
        <p class="text-secondary small">당신의 고민과 통찰이 기록되는 신비로운 공간입니다.</p>
    </div>

    <div class="board-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <span class="text-secondary small">기록된 운명: <span th:text="${boardList.size()}">0</span>건</span>
            <a href="/save" class="btn btn-gold btn-sm">
                <i class="fa-solid fa-pen-nib me-2"></i>새로운 이야기 쓰기
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="text-center">
                <tr>
                    <th style="width: 10%">번호</th>
                    <th style="width: 45%">제목</th>
                    <th style="width: 15%">작성자</th>
                    <th style="width: 20%">날짜</th>
                    <th style="width: 10%">조회</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="board: ${boardList}" th:onclick="|location.href='@{|/${board.id}|}'|">
                    <td class="text-center text-secondary small" th:text="${board.id}">1</td>
                    <td>
                        <a th:href="@{|/${board.id}|}" class="board-title-link" th:text="${board.boardTitle}">제목입니다.</a>
                    </td>
                    <td class="text-center" th:text="${board.boardWriter}">작성자</td>
                    <td class="text-center text-secondary small" th:text="${board.createdAt}">2026-02-03</td>
                    <td class="text-center">
                        <span class="hit-badge" th:text="${board.boardHits}">0</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(boardList)}">
                    <td colspan="5" class="text-center py-5 text-muted">아직 기록된 운명이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/common :: footerFragment}"></div>

<div id="notification-toast" class="toast align-items-center text-white bg-dark border-gold border" role="alert" style="position: fixed; bottom: 20px; right: 20px; z-index: 2000;">
    <div class="d-flex">
        <div class="toast-body">
            <i class="fa-solid fa-star text-warning me-2"></i> <span id="toast-message">새 알림이 있습니다.</span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // SSE 알림 스크립트 (메인 페이지와 동일한 로직 유지)
    function showNotification(message) {
        document.getElementById('toast-message').innerText = message;
        const toast = new bootstrap.Toast(document.getElementById('notification-toast'));
        toast.show();
        const countBadge = document.getElementById('notif-count');
        countBadge.innerText = parseInt(countBadge.innerText) + 1;
    }
</script>
</body>
</html>
