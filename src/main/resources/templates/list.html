<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Tarot | 운명의 광장</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" type="text/css" href="/css/style.css" />
    <style>
        /* 페이징 네비게이션 컨테이너 */
        .pagination-container {
            margin-top: 0rem;
            display: flex;
            justify-content: center;
        }

        .pagination {
            display: flex;
            list-style: none;
            padding: 0;
            gap: 8px;
        }

        /* 기본 페이지 번호 스타일 */
        .page-item .page-link {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3); /* 연한 금색 테두리 */
            color: #d4af37; /* 금색 글자 */
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: 'Playfair Display', serif;
        }

        /* 마우스 호버 시 */
        .page-item .page-link:hover {
            background-color: #d4af37;
            color: #1a1a1a;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
        }

        /* 현재 활성화된 페이지 (Active) */
        .page-item.active .page-link {
            background-color: #d4af37;
            border-color: #d4af37;
            color: #1a1a1a;
            font-weight: bold;
        }

        /* 비활성화된 버튼 (이전/다음 없을 때) */
        .page-item.disabled .page-link {
            background-color: transparent;
            border-color: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
        }

        /* 이전/다음 아이콘 스타일 */
        .page-link i {
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/common :: headerFragment}"></div>

<main class="container mt-5">
    <div class="text-center mb-5">
        <h2 style="font-family: 'Playfair Display', serif; color: var(--gold-accent);" class="display-6">운명의 광장 (Community)</h2>
        <p class="text-secondary small">당신의 고민과 통찰이 기록되는 신비로운 공간입니다.</p>
    </div>

    <div class="board-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <span class="text-secondary small">기록된 운명: <span th:text="${boardCount}">0</span>건</span>
            <a href="/save" class="btn btn-gold btn-sm">
                <i class="fa-solid fa-pen-nib me-2"></i>새로운 이야기 쓰기
            </a>
        </div>

        <nav class="pagination-container" aria-label="Page navigation">
            <ul class="pagination">
                <li class="page-item" th:classappend="${boardList.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/list(page=1)}" aria-label="First">
                        <i class="fa-solid fa-angles-left"></i>
                    </a>
                </li>

                <li class="page-item" th:classappend="${boardList.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/list(page=${boardList.number})}" aria-label="Previous">
                        <i class="fa-solid fa-chevron-left"></i>
                    </a>
                </li>

                <li th:each="page: ${#numbers.sequence(startPage, endPage)}"
                    th:classappend="${page == boardList.number + 1} ? 'active' : ''"
                    class="page-item">
                    <a class="page-link" th:text="${page}" th:href="@{/list(page=${page})}">1</a>
                </li>

                <li class="page-item" th:classappend="${boardList.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/list(page=${boardList.number + 2})}" aria-label="Next">
                        <i class="fa-solid fa-chevron-right"></i>
                    </a>
                </li>

                <li class="page-item" th:classappend="${boardList.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/list(page=${boardList.totalPages})}" aria-label="Last">
                        <i class="fa-solid fa-angles-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="text-center">
                <tr>
                    <th style="width: 10%">번호</th>
                    <th style="width: 45%">제목</th>
                    <th style="width: 15%">작성자</th>
                    <th style="width: 20%">날짜</th>
                    <th style="width: 10%">조회</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="board: ${boardList}" th:onclick="|location.href='@{|/board/${board.id}|}'|">
                    <td class="text-center text-secondary small" th:text="${board.id}">1</td>
                    <td>
                        <a th:href="@{|/board/${board.id}|}" class="board-title-link" th:text="${board.boardTitle}">제목입니다.</a>
                    </td>
                    <td class="text-center" th:text="${board.boardWriter}">작성자</td>
                    <td class="text-center text-secondary small" th:text="${board.createdAt}">2026-02-03</td>
                    <td class="text-center">
                        <span class="hit-badge" th:text="${board.boardHits}">0</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(boardList)}">
                    <td colspan="5" class="text-center py-5 text-muted">아직 기록된 운명이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/common :: footerFragment}"></div>

<div id="notification-toast" class="toast align-items-center text-white bg-dark border-gold border" role="alert" style="position: fixed; bottom: 20px; right: 20px; z-index: 2000;">
    <div class="d-flex">
        <div class="toast-body">
            <i class="fa-solid fa-star text-warning me-2"></i> <span id="toast-message">새 알림이 있습니다.</span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
</div>
</body>
</html>
