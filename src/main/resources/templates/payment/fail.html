<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Tarot | 운명의 연결 실패</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold-accent: #e0b115;
            --dark-bg: #0f0f1b;
            --card-bg: #1a1a2e;
            --error-red: #ff4d4d;
        }

        body {
            background-color: var(--dark-bg);
            color: #e0e0e0;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header & Footer */
        .navbar { background-color: rgba(15, 15, 27, 0.95); border-bottom: 1px solid var(--gold-accent); padding: 15px 0; }
        .navbar-brand { font-family: 'Playfair Display', serif; color: var(--gold-accent) !important; font-weight: 700; }
        footer { background-color: #05050a; color: #888; padding: 40px 0; border-top: 1px solid #222; margin-top: auto; }

        /* Fail Card Content */
        .fail-container { max-width: 600px; margin: 80px auto; text-align: center; }
        .fail-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 77, 77, 0.3);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 0 40px rgba(255, 77, 77, 0.1);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(255, 77, 77, 0.1);
            border: 2px solid var(--error-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 2.5rem;
            color: var(--error-red);
        }

        .error-info {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 20px;
            margin: 30px 0;
            text-align: left;
            border-left: 4px solid var(--error-red);
        }

        .error-msg { color: #fff; font-size: 1rem; margin-bottom: 8px; font-weight: 600; }
        .error-code { color: #888; font-size: 0.85rem; font-family: monospace; }

        .btn-retry {
            background-color: var(--gold-accent);
            color: black;
            font-weight: bold;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            transition: 0.3s;
            text-decoration: none;
        }
        .btn-retry:hover { background-color: #c49a12; color: black; transform: translateY(-2px); }
    </style>
</head>
<body>

<nav th:replace="~{fragments/common :: headerFragment}" class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container"><a class="navbar-brand fs-3" href="/">✨ Mystic Tarot</a></div>
</nav>

<main class="container">
    <div class="fail-container">
        <div class="fail-card">
            <div class="icon-box">
                <i class="fa-solid fa-circle-exclamation"></i>
            </div>

            <h2 style="font-family: 'Playfair Display', serif; color: var(--error-red);">운명의 연결 실패</h2>
            <p class="text-secondary">결제 과정에서 예기치 못한 흐름이 발견되었습니다.<br>아래 사유를 확인해 주세요.</p>

            <div class="error-info">
                <p class="error-msg" th:text="${message}">카드 잔액이 부족합니다.</p>
                <p class="error-code">Error Code: <span th:text="${code}">PAY_PROCESS_CANCELED</span></p>
                <p class="error-code">Order ID: <span th:text="${orderId}">ORDER_123</span></p>
            </div>

            <div class="mt-4">
                <a href="/" class="btn btn-retry me-2">다시 시도하기</a>
                <a href="/list" class="btn btn-outline-light" style="padding: 11px 25px; border-radius: 10px;">상담 게시판</a>
            </div>
        </div>

        <p class="mt-4 text-secondary small">지속적으로 에러가 발생한다면 관리자에게 문의하세요.<br>snmedia153@gmail.com</p>
    </div>
</main>

<footer th:replace="~{fragments/common :: footerFragment}">
    <div class="container text-center">
        <p class="small text-secondary mb-0">&copy; 2026 SN Media. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
