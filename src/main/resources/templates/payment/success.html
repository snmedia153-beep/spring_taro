<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Tarot | 운명의 계약 완료</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --mystic-purple: #2c003e;
            --gold-accent: #e0b115;
            --dark-bg: #0f0f1b;
            --card-bg: #1a1a2e;
        }

        body {
            background-color: var(--dark-bg);
            color: #e0e0e0;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Header & Footer (Fragment 대용 스타일) --- */
        .navbar { background-color: rgba(15, 15, 27, 0.95); border-bottom: 1px solid var(--gold-accent); padding: 15px 0; }
        .navbar-brand { font-family: 'Playfair Display', serif; color: var(--gold-accent) !important; font-weight: 700; }
        footer { background-color: #05050a; color: #888; padding: 40px 0; border-top: 1px solid #222; margin-top: auto; }

        /* --- Success Content --- */
        .success-container {
            max-width: 600px;
            margin: 60px auto;
            text-align: center;
        }

        .success-card {
            background: var(--card-bg);
            border: 1px solid var(--gold-accent);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 0 40px rgba(224, 177, 21, 0.2);
            position: relative;
            overflow: hidden;
        }

        .success-card::before {
            content: "\f00c"; /* Check icon */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: 8rem;
            color: rgba(224, 177, 21, 0.05);
            position: absolute;
            top: -20px;
            right: -20px;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(224, 177, 21, 0.1);
            border: 2px solid var(--gold-accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 2.5rem;
            color: var(--gold-accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(224, 177, 21, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(224, 177, 21, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(224, 177, 21, 0); }
        }

        .payment-info {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 25px;
            margin: 30px 0;
            text-align: left;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .info-label { color: #888; }
        .info-value { color: #fff; font-weight: 600; }

        .btn-gold {
            background-color: var(--gold-accent);
            color: black;
            font-weight: bold;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-gold:hover {
            background-color: #c49a12;
            transform: translateY(-2px);
            color: black;
        }
    </style>
</head>
<body>

<nav th:replace="~{fragments/common :: headerFragment}" class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fs-3" href="/">✨ Mystic Tarot</a>
    </div>
</nav>

<main class="container">
    <div class="success-container">
        <div class="success-card">
            <div class="icon-box">
                <i class="fa-solid fa-check"></i>
            </div>

            <h2 style="font-family: 'Playfair Display', serif; color: var(--gold-accent);">운명의 계약 완료</h2>
            <p class="text-secondary">결제가 정상적으로 승인되었습니다.<br>당신을 위한 별의 지도가 펼쳐집니다.</p>

            <div class="payment-info">
                <div class="info-row">
                    <span class="info-label">주문 번호</span>
                    <span class="info-value" th:text="${orderId}">ORDER_12345</span>
                </div>
                <div class="info-row">
                    <span class="info-label">결제 금액</span>
                    <span class="info-value" th:text="${#numbers.formatInteger(amount, 0, 'COMMA') + '원'}">30,000원</span>
                </div>
                <div class="info-row" style="border-top: 1px solid #333; padding-top: 12px; margin-top: 12px;">
                    <span class="info-label">결제 키(Key)</span>
                    <span class="info-value small" style="font-size: 0.75rem;" th:text="${paymentKey}">tiva_...</span>
                </div>
            </div>

            <div class="mt-4">
                <a href="/mypage" class="btn btn-gold me-2">상담 내역 확인</a>
                <a href="/" class="btn btn-outline-light" style="padding: 11px 25px; border-radius: 10px;">메인으로</a>
            </div>
        </div>

        <p class="mt-4 text-secondary small">상담이 시작되기 전까지 창을 닫지 마세요.<br>문의: snmedia153@gmail.com</p>
    </div>
</main>

<footer th:replace="~{fragments/common :: footerFragment}">
    <div class="container text-center">
        <p class="small text-secondary mb-0">&copy; 2026 SN Media. All rights reserved.</p>
    </div>
</footer>
<script th:inline="javascript">
    // 1. URL에서 토스가 보낸 파라미터 추출
    const urlParams = new URLSearchParams(window.location.search);
    const paymentKey = urlParams.get('paymentKey');
    const orderId = urlParams.get('orderId');
    const amount = urlParams.get('amount');

    // 2. 서버의 승인 API 호출 (fetch 사용)
    if (paymentKey && orderId && amount) {
        fetch('/api/payments/toss/confirm', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                paymentKey: paymentKey,
                orderId: orderId,
                amount: amount
            })
        })
        .then(async (response) => {
            if (response.ok) {
                console.log("✅ 결제 승인 성공 및 DB 저장 완료");
                // 필요시 여기서 알림 팝업이나 페이지 전환 로직 추가
            } else {
                const error = await response.text();
                console.error("❌ 결제 승인 실패:", error);
                alert("결제 승인 중 오류가 발생했습니다.");
            }
        })
        .catch(err => {
            console.error("❌ 네트워크 오류:", err);
        });
    } else {
        console.error("❌ 결제 정보가 부족합니다.");
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
