<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Tarot | 운명의 재기록</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>

<div th:replace="~{fragments/common :: headerFragment}"></div>

<main class="container my-5">
    <div class="text-center mb-5">
        <h2 class="update-title">운명의 재기록</h2>
        <p class="text-secondary">기록된 흐름을 올바른 방향으로 다시 조정합니다.</p>
    </div>

    <div class="update-card">
        <form th:action="@{|/update/${board.id}|}" method="post" name="updateForm" enctype="multipart/form-data">
            <input type="hidden" name="id" th:value="${board.id}">

            <div class="mb-4">
                <label for="boardTitle" class="form-label"><i class="fa-solid fa-feather-pointed"></i> 새로운 제목</label>
                <input type="text" name="boardTitle" id="boardTitle" th:value="${board.boardTitle}" class="form-control" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label for="boardWriter" class="form-label"><i class="fa-solid fa-user-lock"></i> 기록자</label>
                    <input type="text" name="boardWriter" id="boardWriter" th:value="${board.boardWriter}"
                           class="form-control" readonly>
                </div>

                <div class="col-md-6 mb-4" th:if="${loginName == null}">
                    <label for="boardPass" class="form-label"><i class="fa-solid fa-lock"></i> 봉인 암호</label>
                    <input type="password" name="boardPass" id="boardPass" class="form-control"
                           placeholder="수정/삭제 시 필요합니다" required>
                </div>
            </div>

            <div class="mb-4" th:if="${board.fileAttached == 1}">
                <label class="form-label"><i class="fa-solid fa-images"></i> 현재 보관된 형상</label>
                <div class="d-flex gap-2 flex-wrap mb-2">
                    <div th:each="file : ${fileList}" class="position-relative">
                        <img th:src="${fileurl} + '/' + ${file.storedFileName}"
                             style="width: 100px; height: 100px; object-fit: cover; border-radius: 10px;">
                        <div class="form-check small mt-1">
                            <input class="form-check-input" type="checkbox" name="removeFiles" th:value="${file.storedFileName}">
                            <label class="form-check-label text-danger">삭제</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="fa-solid fa-file-circle-plus"></i> 형상 교체 및 추가 (최대 2개)</label>
                <input type="file" name="boardFile" class="form-control" multiple accept="image/*">
            </div>

            <div class="mb-5">
                <label for="boardContents" class="form-label"><i class="fa-solid fa-scroll"></i> 기록 내용 수정</label>
                <textarea name="boardContents" id="boardContents" th:text="${board.boardContents}" class="form-control" rows="12" required></textarea>
            </div>

            <div class="d-flex gap-3">
                <button type="button" class="btn btn-cancel" onclick="history.back()">재기록 취소</button>
                <button type="button" onclick="validateAndUpdate()" class="btn btn-update">운명 반영하기</button>
            </div>
        </form>
    </div>
    <script th:inline="javascript">
        const validateAndUpdate = () => {
            // 1. 필요한 데이터 초기화 (Thymeleaf 변수를 JS에 할당)
            const isAnonymous = [[${#authorization.expression('isAnonymous()')}]];
            const writerId = [[${board.memberId}]]; // 게시글의 member_id
            const passDB = [[${board.boardPass}]]; // 게시글의 비밀번호

            // 2. 로그인 유저인 경우 (ID 비교)
            if (!isAnonymous) {
                const loginId = [[${#authentication.principal.memberId}]]; // PrincipalDetails에서 가져온 ID

                // 작성자 ID와 현재 로그인 ID가 일치하면 즉시 승인
                if (writerId !== null && loginId === writerId) {
                    document.updateForm.submit();
                    return;
                }
            }

            // 3. 비회원 혹은 타인의 글인 경우 (비밀번호 체크)
            const boardPassInput = document.getElementById("boardPass");

            // 비밀번호 입력란이 존재하는지 확인 후 비교
            if (boardPassInput && boardPassInput.value === passDB) {
                document.updateForm.submit();
            } else {
                alert("기록을 수정할 권한이 없거나 봉인 암호가 일치하지 않습니다.");
            }
        }
    </script>
</main>

<div th:replace="~{fragments/common :: footerFragment}"></div>

</body>
</html>
