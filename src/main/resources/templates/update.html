<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Tarot | 운명의 재기록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>

<div th:replace="~{fragments/common :: headerFragment}"></div>

<main class="container my-5">
    <div class="text-center mb-5">
        <h2 class="update-title">운명의 재기록</h2>
        <p class="text-secondary">기록된 흐름을 올바른 방향으로 다시 조정합니다.</p>
    </div>

    <div class="update-card">
        <form th:action="@{|/update/${board.id}|}" method="post" name="updateForm">
            <input type="hidden" name="id" th:value="${board.id}">

            <div class="mb-4">
                <label for="boardTitle" class="form-label"><i class="fa-solid fa-feather-pointed"></i> 새로운 제목</label>
                <input type="text" name="boardTitle" id="boardTitle" th:value="${board.boardTitle}" class="form-control" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label for="boardWriter" class="form-label"><i class="fa-solid fa-user-lock"></i> 기록자 (변경 불가)</label>
                    <input type="text" name="boardWriter" id="boardWriter" th:value="${board.boardWriter}" class="form-control" readonly>
                </div>
                <div class="col-md-6 mb-4">
                    <label for="boardPass" class="form-label"><i class="fa-solid fa-key"></i> 봉인 해제 암호</label>
                    <input type="password" name="boardPass" id="boardPass" class="form-control" placeholder="기존 암호를 입력하세요" required>
                </div>
            </div>

            <div class="mb-5">
                <label for="boardContents" class="form-label"><i class="fa-solid fa-scroll"></i> 기록 내용 수정</label>
                <textarea name="boardContents" id="boardContents" th:text="${board.boardContents}" class="form-control" rows="12" required></textarea>
            </div>

            <div class="d-flex gap-3">
                <button type="button" class="btn  btn-cancel" onclick="history.back()">재기록 취소</button>
                <button type="button" onclick="board_update()" class="btn  btn-update">운명 반영하기</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/common :: footerFragment}"></div>

<script th:inline="javascript">
    const board_update = () => {
        const boardPass = document.getElementById("boardPass").value;
        const passDB = [[${board.boardPass}]];

        if (boardPass == passDB) {
            updateForm.submit();
        } else {
            alert("암호가 일치하지 않아 기록을 수정할 수 없습니다.");
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
