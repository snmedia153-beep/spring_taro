<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mystic Tarot | 회원 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --sidebar-bg: #1a1a2e; --text-gold: #e0b115; }
        body { background-color: #0f0f1b; color: #e0e0e0; font-family: 'Noto Sans KR', sans-serif; }
        .sidebar { height: 100vh; background-color: var(--sidebar-bg); border-right: 1px solid var(--text-gold); position: fixed; }
        .nav-link { color: #d1d1d1; margin-bottom: 10px; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { color: var(--text-gold); background: rgba(224, 177, 21, 0.1); }
        .main-content { margin-left: 16.666667%; } /* 사이드바 너비만큼 여백 */
        .admin-table { background: var(--sidebar-bg); border: 1px solid #333; border-radius: 12px; overflow: hidden; }
        .table { color: #d1d1d1; margin-bottom: 0; vertical-align: middle; }
        .table thead { background: #0f0f1b; color: var(--text-gold); border-bottom: 2px solid var(--text-gold); }
        .text-gold { color: var(--text-gold) !important; }
        .btn-gold { background-color: var(--text-gold); color: #000; border: none; font-weight: bold; }
        .btn-gold:hover { background-color: #c49a12; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar p-3">
            <h4 class="text-gold mb-4"><i class="fa-solid fa-eye"></i> Admin Center</h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard"><i class="fa-solid fa-chart-line me-2"></i> 대시보드</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/members"><i class="fa-solid fa-users me-2"></i> 회원 관리</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/payments"><i class="fa-solid fa-credit-card me-2"></i> 결제 현황</a></li>
                <li class="nav-item"><hr class="border-secondary"></li>
                <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-house me-2"></i> 메인으로</a></li>
            </ul>
        </nav>

        <main class="col-md-10 p-4 main-content">
            <h2 class="mb-4 fw-bold"><i class="fa-solid fa-users-gear text-gold"></i> 운명의 명부 (회원 관리)</h2>

            <div class="admin-table shadow-sm">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>성함</th>
                        <th>이메일</th>
                        <th>가입일</th> <th>현재 권한</th>
                        <th>권한 변경</th>
                        <th>알림</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="member : ${members}">
                        <td th:text="${member.id}">1</td>
                        <td th:text="${member.name}">홍길동</td>
                        <td th:text="${member.email}">test@example.com</td>
                        <td th:text="${member.create_date}">2024-01-01</td>
                        <td>
                                <span th:classappend="${member.role == 'ROLE_ADMIN' ? 'badge bg-danger' : 'badge bg-secondary'}"
                                      th:text="${member.role}">ROLE_USER</span>
                        </td>
                        <td>
                            <form action="/admin/members/update-role" method="post" class="d-inline d-flex gap-2">
                                <input type="hidden" name="memberId" th:value="${member.id}">
                                <select name="role" class="form-select form-select-sm bg-dark text-white border-secondary">
                                    <option value="ROLE_USER" th:selected="${member.role == 'ROLE_USER'}">일반</option>
                                    <option value="ROLE_ADMIN" th:selected="${member.role == 'ROLE_ADMIN'}">관리자</option>
                                    <option value="ROLE_BANNED" th:selected="${member.role == 'ROLE_BANNED'}">활동정지</option>
                                </select>
                                <button type="submit" class="btn btn-gold btn-sm text-nowrap">변경</button>
                            </form>
                        </td>
                        <td><button class="btn btn-outline-warning btn-sm"
                                    th:onclick="sendNotice([[${member.email}]])">
                            <i class="fa-solid fa-paper-plane"></i> 알림
                        </button></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function sendNotice(email) {
        const msg = prompt(email + " 님에게 보낼 메시지를 입력하세요:");
        if (msg) {
            fetch(`/admin/members/send-notice?email=${email}&message=${encodeURIComponent(msg)}`, {
                method: 'POST'
            }).then(res => alert("전송되었습니다."));
        }
    }
</script>
</body>
</html>
