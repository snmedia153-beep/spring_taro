<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Mystic Tarot | 로그인</title>
  <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
  <link rel="shortcut icon" type="image/x-icon" th:href="@{/favicon.ico}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" type="text/css" href="/css/style.css" />
  <style>
    .login-card { background: var(--card-bg); border: 1px solid var(--gold-accent); border-radius: 15px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 0 30px rgba(224, 177, 21, 0.2); }
    .login-title { font-family: 'Playfair Display', serif; color: var(--gold-accent); text-align: center; margin-bottom: 30px; }

    .auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; }
    .auth-footer a { color: var(--gold-accent); text-decoration: none; }
  </style>
</head>
<body>
<div th:replace="~{fragments/common :: headerFragment}"></div>
<main class="container my-5 d-flex justify-content-center">
  <div class="login-card">
    <h2 class="login-title"><i class="fa-solid fa-moon"></i> Login</h2>
    <script th:inline="javascript">
      window.onload = function() {
          const urlParams = new URLSearchParams(window.location.search);
          const error = urlParams.get('error');
          const exception = urlParams.get('exception');

          if (error === 'true') {
              // URL에 담긴 에러 메시지를 alert으로 띄움
              alert(decodeURIComponent(exception));
          }
      };
    </script>
    <form action="/login" method="post">
      <div class="mb-3">
        <label class="form-label">이메일 주소</label>
        <input type="email" name="username" class="form-control" placeholder="example@gmail.com" required>
      </div>
      <div class="mb-4">
        <label class="form-label">비밀번호</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-gold mb-3">운명의 문 열기</button>
    </form>
    <div class="auth-footer">
      <p>계정이 없으신가요? <a href="/signup">운명 공동체 합류하기</a></p>
      <a href="/" class="text-secondary small"><i class="fa-solid fa-arrow-left"></i> 메인으로 돌아가기</a>
    </div>
  </div>
</main>
<div th:replace="~{fragments/common :: footerFragment}"></div>
</body>
</html>
