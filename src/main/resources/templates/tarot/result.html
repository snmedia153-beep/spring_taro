<style>
    .tarot-scene { width: 300px; height: 500px; perspective: 1000px; margin: 0 auto; }
    .tarot-card {
        width: 100%; height: 100%; position: relative;
        transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        transform-style: preserve-3d; cursor: pointer;
    }
    .tarot-card.is-flipped { transform: rotateY(180deg); }

    .card-face {
        position: absolute; width: 100%; height: 100%;
        backface-visibility: hidden; border-radius: 15px;
        border: 3px solid #e0b115;
    }
    .card-front { /* 카드 뒷면(처음 보이는 면) */
        background: url('/images/tarot_back.png') no-repeat center;
        background-size: cover;
    }
    .card-back { /* 카드 앞면(결과 이미지) */
        transform: rotateY(180deg);
        background-color: #1a1a2e;
    }
</style>

<div class="tarot-scene">
    <div class="tarot-card" id="targetCard" onclick="this.classList.toggle('is-flipped')">
        <div class="card-face card-front shadow-glow"></div>
        <div class="card-back shadow-glow">
            <img th:src="${card.imagePath}" class="img-fluid p-2">
            <div class="p-3 text-center">
                <h4 class="text-gold" th:text="${card.name}">The Fool</h4>
            </div>
        </div>
    </div>
</div>

<div class="mt-5 text-center result-text" style="display:none;">
    <h3 class="text-white">운명의 해석</h3>
    <p class="lead" th:text="${card.interpretation}">당신의 앞날에 새로운 시작이...</p>
    <a href="/mypage/history" class="btn btn-outline-gold">결과 보관함 확인</a>
</div>

<script>
    document.getElementById('targetCard').addEventListener('click', function() {
        setTimeout(() => {
            document.querySelector('.result-text').style.display = 'block';
        }, 1000); // 1초 뒤 해석 텍스트 노출
    });
</script>
