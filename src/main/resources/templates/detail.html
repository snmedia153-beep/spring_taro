<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${board.boardTitle} + ' | Mystic Tarot'">운명의 기록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>

<div th:replace="~{fragments/common :: headerFragment}"></div>

<main class="container my-5">
    <article class="detail-card">
        <header class="detail-header">
            <h1 class="post-title" th:text="${board.boardTitle}">운명의 기록이 나타나는 곳</h1>
            <div class="meta-info">
                <div class="meta-item">
                    <i class="fa-solid fa-user-nib"></i>
                    <span th:text="${board.boardWriter}">작성자</span>
                </div>
                <div class="meta-item">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span th:text="${board.createdAt}">2026.02.03</span>
                </div>
                <div class="meta-item">
                    <i class="fa-solid fa-eye"></i>
                    <span>통찰수 <span th:text="${board.boardHits}">0</span></span>
                </div>
            </div>
        </header>

        <div class="detail-body" th:text="${board.boardContents}">
            여기에 본문 내용이 신비롭게 출력됩니다.
        </div>
        <div class="image-section" th:if="${board.fileAttached == 1}">
            <p class="text-gold small mb-3"><i class="fa-solid fa-images me-2"></i>첨부된 영상(이미지)</p>
            <div class="row g-4">
                <div class="col-12 col-md-8 mx-auto" th:each="boardFile: ${boardFileList}">
                    <div class="img-wrapper shadow">
                        <img th:src="@{${fileurl} + '/' + ${boardFile.storedFileName}}" class="attached-img" alt="첨부이미지">
                    </div>
                </div>
            </div>
        </div>

        <footer class="detail-footer">
            <button class="btn btn-list" onclick="listReq()">
                <i class="fa-solid fa-list"></i> 목록으로
            </button>
            <div class="d-flex gap-2">
                <button class="btn  btn-edit" onclick="updateReq()">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 기록 수정
                </button>
                <button class="btn  btn-delete" onclick="deleteReq()">
                    <i class="fa-solid fa-trash-can"></i> 흔적 삭제
                </button>
            </div>
        </footer>
    </article>
</main>

<div th:replace="~{fragments/common :: footerFragment}"></div>

<script th:inline="javascript">
    const listReq = () => { location.href = "/list"; }
    const updateReq = () => { location.href = `/update/[[${board.id}]]`; }
    const deleteReq = () => {
        if(confirm("기록된 운명을 영구히 삭제하시겠습니까?")) {
            location.href = `/delete/[[${board.id}]]`;
        }
    }
</script>

</body>
</html>
